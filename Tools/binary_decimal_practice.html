<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decimal ↔ Binary Practice</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: "Courier New", Courier, monospace;
    background: #1e1e1e;
    color: #e0e0e0;
    margin: 0;
    padding: 24px;
  }

  h1 {
    text-align: center;
    font-size: 1.3rem;
    margin-bottom: 24px;
    color: #f0f0f0;
  }

  .top-controls {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }

  button {
    font-family: inherit;
    font-size: 0.9rem;
    background: #2d2d2d;
    color: #e0e0e0;
    border: 1px solid #555;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 3px;
  }

  button:hover {
    background: #3a3a3a;
  }

  .container {
    display: flex;
    gap: 32px;
    max-width: 900px;
    margin: 0 auto;
    flex-wrap: wrap;
  }

  .section {
    flex: 1;
    min-width: 280px;
    background: #262626;
    border: 1px solid #3d3d3d;
    border-radius: 4px;
    padding: 16px 20px;
  }

  .section h2 {
    font-size: 1rem;
    margin-top: 0;
    margin-bottom: 12px;
    color: #f0f0f0;
    border-bottom: 1px solid #3d3d3d;
    padding-bottom: 8px;
  }

  ul.qlist {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  ul.qlist li {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px dashed #3a3a3a;
    font-size: 0.95rem;
  }

  ul.qlist li:last-child {
    border-bottom: none;
  }

  .answer {
    color: #6fcf97;
    margin-left: 12px;
    visibility: hidden;
  }

  .answer.revealed {
    visibility: visible;
  }

  .reveal-btn {
    margin-top: 16px;
    width: 100%;
  }

  @media (max-width: 600px) {
    .container {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<h1>Decimal ↔ Binary Practice (8-bit)</h1>

<div class="top-controls">
  <button id="regenBtn">New Questions</button>
</div>

<div class="container">

  <div class="section">
    <h2>Decimal to Binary</h2>
    <ul class="qlist" id="decList"></ul>
    <button class="reveal-btn" id="revealDec">Reveal Answers</button>
  </div>

  <div class="section">
    <h2>Binary to Decimal</h2>
    <ul class="qlist" id="binList"></ul>
    <button class="reveal-btn" id="revealBin">Reveal Answers</button>
  </div>

</div>

<script>
  function randomByte() {
    return Math.floor(Math.random() * 256);
  }

  function toBinary8(n) {
    return n.toString(2).padStart(8, '0');
  }

  function generateSet() {
    const decNumbers = [];
    const binNumbers = [];
    for (let i = 0; i < 10; i++) {
      decNumbers.push(randomByte());
      binNumbers.push(randomByte());
    }
    return { decNumbers, binNumbers };
  }

  function renderDecSection(decNumbers) {
    const list = document.getElementById('decList');
    list.innerHTML = '';
    decNumbers.forEach(num => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${num}</span><span class="answer">${toBinary8(num)}</span>`;
      list.appendChild(li);
    });
  }

  function renderBinSection(binNumbers) {
    const list = document.getElementById('binList');
    list.innerHTML = '';
    binNumbers.forEach(num => {
      const bin = toBinary8(num);
      const li = document.createElement('li');
      li.innerHTML = `<span>${bin}</span><span class="answer">${num}</span>`;
      list.appendChild(li);
    });
  }

  function resetReveals() {
    document.querySelectorAll('.answer').forEach(el => el.classList.remove('revealed'));
  }

  function newQuestions() {
    const { decNumbers, binNumbers } = generateSet();
    renderDecSection(decNumbers);
    renderBinSection(binNumbers);
    resetReveals();
  }

  document.getElementById('revealDec').addEventListener('click', () => {
    document.querySelectorAll('#decList .answer').forEach(el => el.classList.add('revealed'));
  });

  document.getElementById('revealBin').addEventListener('click', () => {
    document.querySelectorAll('#binList .answer').forEach(el => el.classList.add('revealed'));
  });

  document.getElementById('regenBtn').addEventListener('click', newQuestions);

  // initial load
  newQuestions();
</script>

</body>
</html>
